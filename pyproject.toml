[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake"
version = "0.1.0"
description = "Robust Multimodal Deepfake Analysis: audio-visual deepfake detection with robustness testing and explainability"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
